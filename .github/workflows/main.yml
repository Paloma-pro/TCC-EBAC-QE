name: CI TCC EBAC - Qualidade de Software

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.2'
      
      - name: Instalar dependências da API
        run: |
          cd API
          npm install

      - name: Rodar Testes de API
        run: |
          cd API
          npm test

  ui-tests:
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.18.2'

      - name: Instalar Dependências da UI
        run: |
          cd UI
          npm install

      - name: Rodar Cypress
        run: |
          cd UI
          npx cypress run